# ============================================================
# CD Pipeline – MarketWatch Sénégal
# Déclenchement : push sur main uniquement (après merge PR)
# ============================================================
name: CD – Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  REGISTRY: docker.io
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/marketwatch-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/marketwatch-frontend

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Push des images Docker Hub
  # ─────────────────────────────────────────────
  push-images:
    name: Docker Hub – Push images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐳 Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Génération des tags (backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: ☕ Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 📦 Build JAR backend
        working-directory: backend
        run: mvn package -DskipTests -q

      - name: 🚀 Push image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🟩 Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 🏷️ Tags Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🚀 Push image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 2 : Déploiement sur Kubernetes
  # ─────────────────────────────────────────────
  deploy:
    name: Kubernetes – Deploy
    runs-on: ubuntu-latest
    needs: push-images
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: 🔑 Configuration du contexte Kubernetes
        # Stocker le kubeconfig dans GitHub Secrets > KUBE_CONFIG
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 📋 Vérification du cluster
        run: kubectl get nodes

      - name: 📁 Application des manifests de base (namespace + secrets)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres-secret.yaml

      - name: 🗄️ Déploiement PostgreSQL + Redis
        run: |
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl rollout status deployment/postgres -n marketwatch --timeout=120s
          kubectl rollout status deployment/redis -n marketwatch --timeout=60s

      - name: 🔄 Mise à jour des images dans les déploiements
        env:
          IMAGE_TAG: ${{ needs.push-images.outputs.image-tag }}
        run: |
          kubectl set image deployment/marketwatch-backend \
            backend=${{ env.IMAGE_BACKEND }}:${IMAGE_TAG} \
            -n marketwatch
          kubectl set image deployment/marketwatch-frontend \
            frontend=${{ env.IMAGE_FRONTEND }}:${IMAGE_TAG} \
            -n marketwatch

      - name: 🚀 Application des services et ingress
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: ✅ Vérification du déploiement Backend
        run: |
          kubectl rollout status deployment/marketwatch-backend \
            -n marketwatch --timeout=180s

      - name: ✅ Vérification du déploiement Frontend
        run: |
          kubectl rollout status deployment/marketwatch-frontend \
            -n marketwatch --timeout=120s

      - name: 📊 État final du cluster
        run: |
          echo "=== Pods MarketWatch ==="
          kubectl get pods -n marketwatch
          echo "=== Services ==="
          kubectl get services -n marketwatch
          echo "=== Ingress ==="
          kubectl get ingress -n marketwatch

      - name: 🔔 Notification de déploiement (optionnel)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Déploiement MarketWatch : $STATUS (commit: ${{ github.sha }})"
          # Ici vous pouvez ajouter un webhook Slack/Teams/email
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} -d '{"text":"Deploy: '"$STATUS"'"}'
