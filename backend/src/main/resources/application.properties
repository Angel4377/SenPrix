# ─── Serveur ────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=SamaPrix

# ─── Base de données PostgreSQL ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/marketwatch_db
spring.datasource.username=postgres
spring.datasource.password=passer
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Initialisation des données ─────────────────────────────────────────────
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ─── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=MarketWatchSenegal2024SuperSecretKeyPourJWTHS256MemoireMaster
app.jwt.expiration-ms=900000
# 900000 ms = 15 minutes (access token court-vecu)
app.jwt.refresh-expiration-days=7
# Refresh token valide 7 jours, revoque a chaque rotation

# ─── CORS ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ─── Cache ───────────────────────────────────────────────────────────────────
# Utilise le cache en mémoire (simple) si Redis n'est pas disponible.
# Pour activer Redis : remplacer "simple" par "redis" et décommenter les 2 lignes ci-dessous.
spring.cache.type=simple
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# ─── Upload de fichiers (import CSV/Excel) ───────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Swagger / OpenAPI ───────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
