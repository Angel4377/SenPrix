# ─── Profil Production (Docker / Cloud) ─────────────────────────────────────
# Les valeurs sont injectées par les variables d'environnement Docker Compose
# ou Kubernetes Secrets. Ne jamais committer de vraies credentials ici.

# ─── JPA (prod : pas de logs SQL) ────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update

# ─── Cache Redis (prod) ───────────────────────────────────────────────────────
spring.cache.type=redis

# ─── CORS (prod : remplacer par le vrai domaine) ─────────────────────────────
app.cors.allowed-origins=http://localhost,http://localhost:80

# ─── Swagger désactivé en production (optionnel) ─────────────────────────────
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false

# ─── Actuator (health check Docker/K8s) ──────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
