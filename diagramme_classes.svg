<svg viewBox="0 0 1260 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagramme de classes — MarketWatch Sénégal</title>
<desc>Diagramme UML des entités JPA du backend Spring Boot — DITI5 2025/2026</desc>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#111" stroke-width="1.3"/>
  </marker>
</defs>
<style>
  svg{background:#fff}
  rect{fill:#fff;stroke:#111;stroke-width:1.2}
  line{stroke:#111;stroke-width:1}
  polyline{stroke:#111;stroke-width:1;fill:none}
  text{font-family:'Courier New',monospace;font-size:10px;fill:#111}
  .cn{font-family:Arial,sans-serif;font-weight:700;font-size:12px;text-anchor:middle;dominant-baseline:middle}
  .st{font-family:Arial,sans-serif;font-size:9px;text-anchor:middle;font-style:italic;fill:#444}
  .mu{font-family:Arial,sans-serif;font-size:9px;fill:#111}
  .rl{font-family:Arial,sans-serif;font-size:8px;fill:#666;font-style:italic}
  .en{font-family:Arial,sans-serif;font-size:8.5px;font-style:italic;text-anchor:middle;fill:#333}
</style>

<!-- Product -->
<rect x="30" y="30" width="185" height="110"/>
<line x1="30" y1="52" x2="215" y2="52"/>
<text x="122" y="44" class="cn">Product</text>
<text x="36" y="66">- id : Long</text>
<text x="36" y="79">- name : String</text>
<text x="36" y="92">- category : String</text>
<text x="36" y="105">- unit : String</text>

<!-- Region -->
<rect x="290" y="30" width="175" height="85"/>
<line x1="290" y1="52" x2="465" y2="52"/>
<text x="377" y="44" class="cn">Region</text>
<text x="296" y="66">- id : Long</text>
<text x="296" y="79">- name : String</text>

<!-- User -->
<rect x="640" y="30" width="230" height="215"/>
<line x1="640" y1="52" x2="870" y2="52"/>
<text x="755" y="44" class="cn">User</text>
<text x="646" y="66">- id : Long</text>
<text x="646" y="79">- name : String</text>
<text x="646" y="92">- email : String</text>
<text x="646" y="105">- password : String</text>
<text x="646" y="118">- role : Role</text>
<text x="646" y="131">- region : String</text>
<text x="646" y="144">- createdAt : LocalDateTime</text>
<line x1="640" y1="153" x2="870" y2="153"/>
<text x="755" y="164" class="en">«enum» Role</text>
<text x="755" y="176" class="en">ADMIN | CONSUMER | AGENT | MERCHANT</text>

<!-- Mission -->
<rect x="990" y="30" width="215" height="190"/>
<line x1="990" y1="52" x2="1205" y2="52"/>
<text x="1097" y="44" class="cn">Mission</text>
<text x="996" y="66">- id : Long</text>
<text x="996" y="79">- title : String</text>
<text x="996" y="92">- description : String</text>
<text x="996" y="105">- status : Status</text>
<text x="996" y="118">- scheduledDate : LocalDate</text>
<text x="996" y="131">- createdAt : LocalDateTime</text>
<line x1="990" y1="140" x2="1205" y2="140"/>
<text x="1097" y="151" class="en">«enum» Status</text>
<text x="1097" y="163" class="en">PLANNED | IN_PROGRESS | COMPLETED</text>

<!-- OfficialPrice -->
<rect x="30" y="280" width="225" height="185"/>
<line x1="30" y1="302" x2="255" y2="302"/>
<text x="142" y="294" class="cn">OfficialPrice</text>
<text x="36" y="316">- id : Long</text>
<text x="36" y="329">- price : Double</text>
<text x="36" y="342">- currency : String</text>
<text x="36" y="355">- validFrom : LocalDate</text>
<text x="36" y="368">- validTo : LocalDate</text>
<text x="36" y="381">- createdAt : LocalDateTime</text>

<!-- Report -->
<rect x="290" y="270" width="225" height="290"/>
<line x1="290" y1="292" x2="515" y2="292"/>
<text x="402" y="284" class="cn">Report</text>
<text x="296" y="306">- id : Long</text>
<text x="296" y="319">- priceObserved : Double</text>
<text x="296" y="332">- officialPrice : Double</text>
<text x="296" y="345">- lat : Double</text>
<text x="296" y="358">- lng : Double</text>
<text x="296" y="371">- description : String</text>
<text x="296" y="384">- status : Status</text>
<text x="296" y="397">- priority : Priority</text>
<text x="296" y="410">- confirmationCount : Integer</text>
<text x="296" y="423">- createdAt : LocalDateTime</text>
<line x1="290" y1="432" x2="515" y2="432"/>
<text x="402" y="443" class="en">«enum» Status: PENDING|VERIFIED|RESOLVED|REJECTED</text>
<text x="402" y="455" class="en">«enum» Priority: LOW|NORMAL|HIGH|CRITICAL</text>

<!-- Notification -->
<rect x="990" y="270" width="215" height="160"/>
<line x1="990" y1="292" x2="1205" y2="292"/>
<text x="1097" y="284" class="cn">Notification</text>
<text x="996" y="306">- id : Long</text>
<text x="996" y="319">- message : String</text>
<text x="996" y="332">- type : String</text>
<text x="996" y="345">- isRead : Boolean</text>
<text x="996" y="358">- createdAt : LocalDateTime</text>

<!-- AuditLog -->
<rect x="640" y="390" width="230" height="260"/>
<line x1="640" y1="412" x2="870" y2="412"/>
<text x="755" y="404" class="cn">AuditLog</text>
<text x="646" y="426">- id : Long</text>
<text x="646" y="439">- action : Action</text>
<text x="646" y="452">- userId : Long</text>
<text x="646" y="465">- userEmail : String</text>
<text x="646" y="478">- resource : String</text>
<text x="646" y="491">- resourceId : Long</text>
<text x="646" y="504">- ipAddress : String</text>
<text x="646" y="517">- details : String</text>
<text x="646" y="530">- createdAt : LocalDateTime</text>
<line x1="640" y1="539" x2="870" y2="539"/>
<text x="755" y="550" class="en">«enum» Action</text>
<text x="755" y="562" class="en">LOGIN | LOGIN_FAILED | LOGOUT | REGISTER</text>
<text x="755" y="574" class="en">REPORT_CREATED | REPORT_VALIDATED | ...</text>

<!-- Merchant -->
<rect x="30" y="510" width="215" height="175"/>
<line x1="30" y1="532" x2="245" y2="532"/>
<text x="137" y="524" class="cn">Merchant</text>
<text x="36" y="546">- id : Long</text>
<text x="36" y="559">- name : String</text>
<text x="36" y="572">- address : String</text>
<text x="36" y="585">- lat : Double</text>
<text x="36" y="598">- lng : Double</text>
<text x="36" y="611">- status : String</text>

<!-- Infraction -->
<rect x="290" y="610" width="225" height="175"/>
<line x1="290" y1="632" x2="515" y2="632"/>
<text x="402" y="624" class="cn">Infraction</text>
<text x="296" y="646">- id : Long</text>
<text x="296" y="659">- description : String</text>
<text x="296" y="672">- fineAmount : Double</text>
<text x="296" y="685">- status : Status</text>
<text x="296" y="698">- createdAt : LocalDateTime</text>
<line x1="290" y1="707" x2="515" y2="707"/>
<text x="402" y="718" class="en">«enum» Status: OPEN | CLOSED</text>

<!-- RefreshToken -->
<rect x="990" y="475" width="215" height="135"/>
<line x1="990" y1="497" x2="1205" y2="497"/>
<text x="1097" y="489" class="cn">RefreshToken</text>
<text x="996" y="511">- id : Long</text>
<text x="996" y="524">- token : String</text>
<text x="996" y="537">- expiresAt : Instant</text>
<text x="996" y="550">- revoked : Boolean</text>

<!-- ══════════ ASSOCIATIONS ══════════ -->

<!-- OfficialPrice → Product -->
<polyline points="122,280 122,140" marker-end="url(#a)"/>
<text x="126" y="155" class="mu">1</text>
<text x="126" y="278" class="mu">*</text>
<text x="128" y="215" class="rl">product</text>

<!-- OfficialPrice → Region -->
<polyline points="255,330 377,330 377,115" marker-end="url(#a)"/>
<text x="381" y="120" class="mu">1</text>
<text x="258" y="328" class="mu">*</text>
<text x="306" y="327" class="rl">region</text>

<!-- OfficialPrice → User (setBy) -->
<polyline points="142,280 142,252 640,252" marker-end="url(#a)"/>
<text x="644" y="250" class="mu">0..1</text>
<text x="36" y="278" class="mu">*</text>
<text x="345" y="249" class="rl">setBy</text>

<!-- Merchant → Region -->
<polyline points="245,565 270,565 270,115 290,115" marker-end="url(#a)"/>
<text x="293" y="113" class="mu">1</text>
<text x="247" y="563" class="mu">*</text>

<!-- Merchant → User -->
<polyline points="245,550 560,550 560,252 640,252" marker-end="url(#a)"/>
<text x="248" y="548" class="mu">*</text>
<text x="634" y="261" class="mu">1</text>
<text x="390" y="548" class="rl">user</text>

<!-- Report → User (consumer) -->
<polyline points="515,305 580,305 580,252 640,252" marker-end="url(#a)"/>
<text x="518" y="303" class="mu">*</text>
<text x="633" y="267" class="mu">1</text>
<text x="523" y="303" class="rl">consumer</text>

<!-- Report → Product -->
<polyline points="350,270 350,225 215,225 215,85" marker-end="url(#a)"/>
<text x="218" y="90" class="mu">1</text>
<text x="353" y="268" class="mu">*</text>
<text x="228" y="200" class="rl">product</text>

<!-- Report → Merchant -->
<polyline points="290,490 255,490 255,555 245,555" marker-end="url(#a)"/>
<text x="247" y="558" class="mu">0..1</text>
<text x="287" y="488" class="mu">*</text>

<!-- Report → Region -->
<polyline points="402,270 402,115" marker-end="url(#a)"/>
<text x="406" y="120" class="mu">1</text>
<text x="406" y="268" class="mu">*</text>
<text x="408" y="195" class="rl">region</text>

<!-- Infraction → Report -->
<polyline points="402,610 402,560" marker-end="url(#a)"/>
<text x="406" y="558" class="mu">1</text>
<text x="406" y="608" class="mu">*</text>
<text x="408" y="587" class="rl">report</text>

<!-- Infraction → User (agent) -->
<polyline points="515,645 578,645 578,252 640,252" marker-end="url(#a)"/>
<text x="518" y="643" class="mu">*</text>
<text x="633" y="264" class="mu">1</text>
<text x="528" y="643" class="rl">agent</text>

<!-- Infraction → Merchant -->
<polyline points="290,665 245,665" marker-end="url(#a)"/>
<text x="247" y="663" class="mu">0..1</text>
<text x="293" y="663" class="mu">*</text>

<!-- Mission → User (agent) -->
<polyline points="990,110 870,110" marker-end="url(#a)"/>
<text x="872" y="108" class="mu">1</text>
<text x="945" y="108" class="mu">*</text>
<text x="900" y="107" class="rl">agent</text>

<!-- Mission → Region -->
<polyline points="990,180 570,180 570,115 465,115" marker-end="url(#a)"/>
<text x="462" y="113" class="mu">1</text>
<text x="944" y="178" class="mu">*</text>
<text x="720" y="178" class="rl">region</text>

<!-- Notification → User -->
<polyline points="990,330 875,330 875,245 870,245" marker-end="url(#a)"/>
<text x="868" y="244" class="mu">1</text>
<text x="944" y="328" class="mu">*</text>
<text x="900" y="328" class="rl">user</text>

<!-- RefreshToken → User -->
<polyline points="990,535 878,535 878,248 870,248" marker-end="url(#a)"/>
<text x="868" y="247" class="mu">1</text>
<text x="944" y="533" class="mu">*</text>
<text x="900" y="533" class="rl">user</text>

<!-- Footer -->
<text x="630" y="800" class="cn" style="font-size:11px;fill:#888">Diagramme de classes — MarketWatch Sénégal · DITI5 2025/2026</text>
</svg>
