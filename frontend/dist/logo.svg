<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond blanc arrondi -->
  <rect width="100" height="100" rx="22" ry="22" fill="white"/>

  <!-- Bande verte gauche (drapeau sénégal) -->
  <rect x="6" y="6" width="29" height="88" rx="16" ry="16" fill="#00853F"/>

  <!-- Bande rouge droite (drapeau sénégal) -->
  <rect x="65" y="6" width="29" height="88" rx="16" ry="16" fill="#E31B23"/>

  <!-- Fond vert principal -->
  <rect x="6" y="6" width="88" height="88" rx="16" ry="16" fill="#00853F"/>

  <!-- Chariot — corps -->
  <rect x="28" y="38" width="44" height="26" rx="5" ry="5" fill="white" opacity="0.95"/>

  <!-- Chariot — anse/poignée -->
  <path d="M22 30 L28 38" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="28" r="4" fill="#FDEF42"/>

  <!-- Chariot — roues -->
  <circle cx="36" cy="68" r="5" fill="white" opacity="0.95"/>
  <circle cx="62" cy="68" r="5" fill="white" opacity="0.95"/>
  <circle cx="36" cy="68" r="2.5" fill="#00853F"/>
  <circle cx="62" cy="68" r="2.5" fill="#00853F"/>

  <!-- Barres graphique prix (vert, jaune, rouge) dans le chariot -->
  <rect x="33" y="55" width="6" height="7" rx="1.5" fill="#FDEF42"/>
  <rect x="43" y="48" width="6" height="14" rx="1.5" fill="#FDEF42"/>
  <rect x="53" y="43" width="6" height="19" rx="1.5" fill="#E31B23"/>
  <rect x="63" y="50" width="6" height="12" rx="1.5" fill="#FDEF42"/>

  <!-- Étoile verte sénégalaise (au-dessus du chariot) -->
  <g transform="translate(50, 23)">
    <polygon
      points="0,-8 1.9,-2.6 7.6,-2.6 3.1,1 4.7,6.5 0,3.2 -4.7,6.5 -3.1,1 -7.6,-2.6 -1.9,-2.6"
      fill="#FDEF42"
    />
  </g>
</svg>
