apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketwatch-backend
  namespace: marketwatch
  labels:
    app: marketwatch-backend
spec:
  replicas: 2  # Haute disponibilité
  selector:
    matchLabels:
      app: marketwatch-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # Zéro downtime
      maxSurge: 1
  template:
    metadata:
      labels:
        app: marketwatch-backend
    spec:
      containers:
        - name: backend
          # Image mise à jour par le pipeline CD
          image: DOCKERHUB_USERNAME/marketwatch-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/marketwatch_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: APP_FIREBASE_ENABLED
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: marketwatch-backend
  namespace: marketwatch
spec:
  selector:
    app: marketwatch-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
# Autoscaling horizontal basé sur la CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: marketwatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketwatch-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
