apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketwatch-frontend
  namespace: marketwatch
  labels:
    app: marketwatch-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketwatch-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: marketwatch-frontend
    spec:
      containers:
        - name: frontend
          image: DOCKERHUB_USERNAME/marketwatch-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: marketwatch-frontend
  namespace: marketwatch
spec:
  selector:
    app: marketwatch-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
